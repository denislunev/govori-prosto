<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Говори просто</title>
<meta name="theme-color" content="#e4572e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, plain, encouraging — a patient teacher, no games or scores
   IDEA: a child's picture flashcard: one big simple sentence per card
   PICTURE: the practice card itself, large, at the top of each screen
   COLOUR and TYPE: white + sky field, ink text, one coral accent; Nunito rounded
   LAYOUT: one calm column up to 720px, big tap targets, stacks on phone */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f171e);--ink:light-dark(#14202b,#eaf1f6);--mute:light-dark(#5b6b78,#9fb0bd);
--sky:light-dark(#dff1ff,#15303f);--line:light-dark(#d5e3ee,#24404f);--card:light-dark(#ffffff,#152029);
--acc:#e4572e;--ok:light-dark(#1d8a4b,#4fd18a);--bad:light-dark(#c63b3b,#ff7b7b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
.top{background:var(--sky);padding:20px max(5vw,16px) 22px}
.wrap{max-width:720px;margin:0 auto}
.main{padding:20px max(5vw,16px) 60px}
h1{font-size:clamp(32px,7vw,46px);line-height:1.05;margin:0;font-weight:900;text-wrap:balance}
h2{font-size:22px;margin:28px 0 10px;font-weight:800}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:14px}
button,input{font:inherit;color:inherit}
.btn{min-height:46px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.back{border:0;background:none;font-weight:800;color:var(--mute);padding:6px 0;min-height:44px;cursor:pointer}
.today{margin-top:16px;background:var(--card);border-radius:20px;padding:18px;border:2px solid var(--line)}
.big{font-size:clamp(40px,10vw,56px);font-weight:900;line-height:1}
.block{border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;background:var(--card)}
.block h3{margin:0;font-size:21px;font-weight:900}
.bar{height:8px;background:var(--sky);border-radius:8px;margin:10px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:8px}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media(min-width:560px){.parts{grid-template-columns:repeat(6,minmax(0,1fr))}}
.parts .btn{padding:8px 4px;font-size:15px}
.rules{margin:0;padding-left:20px}.rules li{margin:6px 0}
.card{background:var(--sky);border-radius:24px;padding:clamp(20px,5vw,32px);margin-top:8px}
.cnt{font-size:14px;color:var(--mute);font-weight:700}
.word{display:inline-block;background:var(--card);border-radius:10px;padding:2px 10px;font-weight:800;margin:6px 0}
.en{font-size:clamp(26px,6.5vw,36px);font-weight:900;line-height:1.2;margin:12px 0 6px}
.en mark{background:none;color:var(--acc)}
.ru{font-size:19px;color:var(--mute)}
.ru.q{font-size:clamp(24px,6vw,32px);color:var(--ink);font-weight:800;line-height:1.25;margin:12px 0}
.hint{font-family:ui-monospace,monospace;font-size:18px;letter-spacing:.5px;margin-top:8px}
.said{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--card)}
.ok{color:var(--ok);font-weight:800}.miss{color:var(--bad);text-decoration:underline wavy;font-weight:800}
.verdict{font-weight:900;font-size:19px}
.inp{display:flex;gap:8px;margin-top:12px}.inp input{flex:1;min-height:46px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--card);font-size:17px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.rate .btn{padding:8px 4px;font-size:15px}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}@media(prefers-reduced-motion:reduce){.mic.on{animation:none}}
.list{list-style:none;padding:0;margin:0}.list li{border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.list b{font-size:19px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;display:none;z-index:9}
textarea{width:100%;min-height:160px;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--card);font:14px/1.4 ui-monospace,monospace}
.bl{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--card);cursor:pointer;width:100%;text-align:left}
.bl .n{font-size:28px;font-weight:900;width:44px;flex:none;color:var(--acc);text-align:center}
.bl .t{flex:1}.bl .t span{display:block}.bl .t b{display:block;font-size:18px}.bl .bar{margin:6px 0 0}
.round{font-weight:900;font-size:15px;color:var(--mute);margin:22px 0 10px}
.story{margin:14px 0}.story p{font-size:20px;line-height:1.65;margin:0 0 14px;font-weight:600}.sl{cursor:pointer;border-radius:6px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sl.cur{background:var(--card);box-shadow:0 0 0 2px var(--acc)}.sl mark{background:none;color:var(--acc)}.se{display:block;font-size:19px;font-weight:700;line-height:1.35}.se mark{background:none;color:var(--acc)}
.sr{display:block;font-size:15px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:4px 10px;border-radius:20px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:15px}
.chip.hit{border-color:var(--ok);color:var(--ok)}.chip.gone{opacity:.45}
.retx{min-height:140px;margin-top:12px;font:16px/1.5 Nunito,system-ui,sans-serif}
@media(min-width:700px){.sticky{position:sticky;top:0;background:var(--sky);padding:8px 0;z-index:2}}
.nav{display:flex;justify-content:space-between;align-items:center}
label.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:700}
.lad{margin-top:16px;background:var(--card);border-radius:20px;padding:18px;border:2px solid var(--acc)}.lt{font-size:22px;font-weight:900;margin:4px 0}
.formula{display:inline-block;margin:10px 0 0;padding:6px 12px;border-radius:12px;background:var(--card);font-weight:800}
.stp{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 0;font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.stp span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none;font-size:15px}
.stp.cur span{background:var(--acc);border-color:var(--acc);color:#fff}.stp.done span{border-color:var(--ok);color:var(--ok)}.stp:disabled{color:var(--mute);cursor:default}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 6px}.strip i{height:6px;border-radius:6px;background:var(--line)}.strip i.done{background:var(--ok)}.strip i.cur{background:var(--acc)}
.bl:disabled{opacity:.55;cursor:default}.bl.done .n{color:var(--ok)}
.exl{margin-top:14px;cursor:pointer;font-size:20px}.exl b mark,.en mark{background:none;color:var(--acc)}
.tile{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:17px;cursor:pointer;margin:3px}.tile.on{border-color:var(--acc)}
.built{min-height:48px;display:flex;flex-wrap:wrap;align-items:center;border-bottom:2px dashed var(--line);padding-bottom:6px}
mark{background:none;color:var(--acc);font-weight:800}
.typo{color:#b88a00;font-weight:800;text-decoration:underline dotted}
.tbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.tbar i{display:block;height:100%;width:100%;background:var(--acc)}
</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>
<script>

ий."], ["supposed", "должен (по плану)", "I'm supposed to be there at eight.", "Я должен быть там в восемь."], ["afford", "позволить себе", "I can't afford a new car.", "Я не могу позволить себе новую машину."], ["regardless", "несмотря ни на что", "I'll go regardless of the weather.", "Я пойду при любой погоде."], ["certainly", "конечно, точно", "I can certainly help you.", "Я конечно могу тебе помочь."]]}, {"id": "b2", "cat": "Чувства и состояния", "items": [["exhausted", "вымотанный", "I'm exhausted after work.", "Я вымотан после работы."], ["annoyed", "раздражённый", "I'm annoyed by the noise.", "Меня раздражает шум."], ["upset", "расстроенный, обиженный", "She is upset with me.", "Она на меня обижена."], ["nervous", "нервный", "I feel nervous before phone calls.", "Я нервничаю перед звонками."], ["worried", "обеспокоенный", "I'm worried about money.", "Я переживаю из-за денег."], ["excited", "в радостном ожидании", "I'm excited about the trip.", "Я с нетерпением жду поездку."], ["proud", "гордый", "I'm proud of my kids.", "Я горжусь своими детьми."], ["embarrassed", "смущённый", "I was so embarrassed.", "Мне было так неловко."], ["confused", "запутавшийся", "I'm confused. Can you explain?", "Я запутался. Можешь объяснить?"], ["disappointed", "разочарованный", "I'm disappointed with the result.", "Я разочарован результатом."], ["grateful", "благодарный", "I'm grateful for your help.", "Я благодарен за твою помощь."], ["relieved", "с облегчением", "I'm relieved it's over.", "Мне легче, что всё закончилось."], ["lonely", "одинокий", "Sometimes I feel lonely.", "Иногда мне одиноко."], ["bored", "скучающий", "I'm bored at home.", "Мне скучно дома."], ["stressed", "в стрессе", "I'm stressed about work.", "У меня стресс из-за работы."], ["calm", "спокойный", "Stay calm. It's okay.", "Спокойно. Всё нормально."], ["surprised", "удивлённый", "I was surprised by the price.", "Меня удивила цена."], ["curious", "любопытный", "I'm curious about it.", "Мне это интересно."], ["satisfied", "довольный", "The client is satisfied.", "Клиент доволен."], ["awkward", "неловкий", "It was an awkward moment.", "Это был неловкий момент."], ["overwhelmed", "перегруженный", "I feel overwhelmed today.", "Сегодня на меня слишком много навалилось."], ["confident", "уверенный", "I'm not confident in my English yet.", "Я пока не уверен в своём английском."], ["scared", "испуганный", "My dog is scared of thunder.", "Моя собака боится грома."], ["comfortable", "комфортный", "I feel comfortable here.", "Мне здесь комфортно."], ["honest", "честный", "To be honest, I don't know.", "Честно говоря, я не знаю."]]}, {"id": "b3", "cat": "Быт и магазин", "items": [["borrow", "одолжить (взять)", "Can I borrow your pen?", "Можно одолжить твою ручку?"], ["remind", "напомнить", "Please remind me tomorrow.", "Напомни мне завтра, пожалуйста."], ["explain", "объяснить", "Can you explain it again?", "Можешь объяснить ещё раз?"], ["mention", "упомянуть", "You didn't mention that.", "Ты об этом не говорил."], ["figure out", "разобраться", "I'll figure it out.", "Я разберусь."], ["pick up", "забрать", "I'll pick you up at seven.", "Я заберу тебя в семь."], ["fix", "починить", "Can you fix it today?", "Можешь починить это сегодня?"], ["deliver", "доставлять", "I deliver food in the evening.", "Я доставляю еду по вечерам."], ["complain", "жаловаться", "I don't want to complain.", "Я не хочу жаловаться."], ["expect", "ожидать", "I didn't expect that.", "Я этого не ожидал."], ["recommend", "советовать", "What do you recommend?", "Что вы посоветуете?"], ["agree", "соглашаться", "I agree with you.", "Я с тобой согласен."], ["refund", "возврат денег", "I want a refund.", "Я хочу вернуть деньги."], ["receipt", "чек", "Do you need the receipt?", "Вам нужен чек?"], ["appointment", "запись на приём", "I have an appointment at ten.", "У меня запись на десять."], ["schedule", "график", "My schedule is busy this week.", "На этой неделе у меня плотный график."], ["neighbor", "сосед", "My nei .", "Прямо сейчас я не работаю."], ["since", "I've been at home since Monday.", "Я дома с понедельника."], ["until", "I'll rest until Friday.", "Буду отдыхать до пятницы."], ["meanwhile", "Meanwhile, I'm learning English.", "А пока я учу английский."], ["while", "I practice while I drink coffee.", "Я занимаюсь, пока пью кофе."], ["during", "I also listen during my drive.", "Ещё я слушаю во время поездки."], ["before", "Before bed, I repeat new words.", "Перед сном я повторяю новые слова."], ["after", "After dinner, I watch a show in English.", "После ужина я смотрю сериал на английском."], ["tonight", "Tonight, I'll call a new client.", "Сегодня вечером я позвоню новому клиенту."], ["in advance", "I'll send him the price in advance.", "Я заранее пришлю ему цену."], ["day after tomorrow", "I'll meet him the day after tomorrow.", "Встречусь с ним послезавтра."], ["next week", "Next week, I'm going back to work.", "На следующей неделе я возвращаюсь на работу."], ["by", "I must finish a big job by Friday.", "Мне нужно закончить большой заказ к пятнице."], ["for now", "For now, I work for my boss.", "Пока что я работаю на начальника."], ["from time to time", "From time to time, I take my own clients.", "Время от времени я беру своих клиентов."], ["soon", "Soon I want to work only for myself.", "Скоро я хочу работать только на себя."], ["later", "Maybe later I'll hire a helper.", "Может, позже найму помощника."], ["someday", "Someday I'll have a big company.", "Когда-нибудь у меня будет большая компания."]]}, {"id": "b10", "title": "A hard delivery night", "titleRu": "Трудный вечер доставки", "lines": [["forecast", "I checked the forecast before work.", "Перед работой я посмотрел прогноз."], ["weather", "The weather was terrible.", "Погода была ужасной."], ["cold", "It was cold and wet.", "Было холодно и сыро."], ["wind", "The wind was very strong.", "Ветер был очень сильный."], ["rain", "Then it started to rain.", "Потом пошёл дождь."], ["snow", "In the mountains, there function sayCard(o){const x=o.x,ear=o.ear,shown=V.shown;
 return `<div class="card"><div class="cnt">${ear?'Послушай и повтори по-английски':'Скажи по-английски'}</div>
 ${ear&&!shown?`<div class="row"><button class="btn" id="play">Слушать ещё раз</button><button class="btn" id="slow">Медленно</button></div>`:`<div class="ru q">${esc(x.ru)}</div>`}
 ${shown?`<div class="en">${hlL(x.en,x.uses)}</div>${ear?`<div class="ru">${esc(x.ru)}</div>`:''}`:''}
 ${V.tiles&&!shown?tilesHtml():''}
 <div class="row">${shown?'<button class="btn" id="play">Слушать</button><button class="btn" id="slow">Медленно</button>':micBtn('pri')+(V.tiles?'':'<button class="btn" id="tl">Собрать из слов</button>')+'<button class="btn ghost" id="show">Не помню — показать</button>'}</div>

 <div id="res">${V.res||''}</div>
 ${shown?`<p class="small mute" style="margin-top:12px">Как прошло?</p><div class="rate"><button class="btn" data-g="0">Трудно</button><button class="btn" data-g="1">Нормально</button><button class="btn" data-g="2">Легко</button></div>`:''}</div>`}
function tilesHtml(){const T=V.tiles;return `<div class="said"><div class="built">${T.pick.map((k,j)=>`<button class="tile on" data-u="${j}">${esc(T.all[k])}</button>`).join('')||'<span class="mute small">Нажимай слова по порядку</span>'}</div>
 <div class="chips">${T.all.map((w,k)=>T.pick.includes(k)?'':`<button class="tile" data-t="${k}">${esc(w)}</button>`).join('')}</div>
 <div class="row"><button class="btn pri" id="tck" ${T.pick.length===T.all.length?'':'disabled'}>Проверить</button></div></div>`}
function bindSayCard(x,ear,onGrade){
 const reveal=h=>{V.res=h||'';V.shown=true;V.tiles=null;render();sayL(x)};
 const got=(alts,typed)=>{const c=checkL(x,alts,typed);if(V.shown){V.res=c.html;$('#res').innerHTML=c.html}else reveal(c.html)};
 const mic=$('#mic');if(mic)mic.onclick=()=>listen(mic,a=>got(a,false));
 const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#t').value.trim();if(v)got([v],true)};
 const pl=$('#play');if(pl)pl.onclick=()=>sayL(x);const sl=$('#slow');if(sl)sl.onclick=()=>sayL(x,true);
 const sh=$('#show');if(sh)sh.onclick=()=>reveal('');
 const tl=$('#tl');if(tl)tl.onclick=()=>{V.tiles={all:shuffle(x.en.replace(/[.,!?]/g,'').split(' ')),pick:[]};render()};
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{V.tiles.pick.push(+b.dataset.t);render()});
 app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{V.tiles.pick.splice(+b.dataset.u,1);render()});

 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>onGrade(+b.dataset.g));
 if(ear&&!V.shown&&!V.heard){V.heard=1;sayL(x)}}

 if(V.n>=V.q.length){advance(V.id,3);return}

 app.innerHTML=`<div class="top"><div class="wrap">${navTop('')}${strip(V.id,3)}<p class="small mute">Фраза ${Math.min(V.n+1,V.q.length)} из ${V.q.length}</p>${sayCard(o)}</div></div>`;

/* test (10 tasks, 70/30) and marathon (50 phrases) share one runner */
function buildTest(id){const own=shuffle(lItems(id)),i=cIdx(id);
 const prev=LD.course.slice(0,i).filter(c=>c.t==='lesson').flatMap(c=>lItems(c.id));
 if(!prev.length)return own.slice(0,10);
 const bank=LS().bank,d=day(),score=x=>(bank[x.k]!=null?100:0)+(((S.p[x.k]||{}).due||1e9)<=d?10:0)+Math.random();
 const old=prev.sort((a,b)=>score(b)-score(a)).slice(0,3);return shuffle(own.slice(0,10-old.length).concat(old))}
function stTest(){if(!V.q){V.q=buildTest(V.id);V.n=0;V.ok=0;V.wrong=[];V.ans=null}runExam({kind:'test',head:navTop('')+strip(V.id,4),back:()=>go({v:'lesson',id:V.id})})}
function marathon(){if(!needLD())return;const c=crs(V.id);if(cStat(V.id)==='lock'){go({v:'ladder'});return}
 if(!V.q){V.q=shuffle(c.of.flatMap(lItems));V.n=0;V.ok=0;V.wrong=[];V.ans=null}
 if(V.timer==null)V.timer=!!S.mtimer;
 runExam({kind:'marathon',head:`${navTop('')}<div class="cnt">${labelOf(c)} · ${V.q.length} фраз вперемешку</div>`,back:()=>go({v:'ladder'})})}
let exT=null;
function runExam(o){clearTimeout(exT);const id=V.id,total=V.q.length;
 if(V.n>=total){const pct=Math.round(V.ok/total*100),r=lrec(id),passed=pct>=85;
  if(pct>r.best)r.best=pct;if(passed){r.pass=1;r.at=day();r.step=4}save();
  const nx=LD.course[cIdx(id)+1];
  app.innerHTML=`<div class="top"><div class="wrap">${o.kind==='test'?navTop('')+strip(id,4):navTop('')}<h1>${pct}%</h1>
  <p class="verdict ${passed?'ok':'miss'}">${passed?(nx?'Сдано! Следующая ступень открыта.':'Сдано! Это была последняя ступень.'):'Нужно 85%. Повтори ошибки и попробуй снова.'}</p>
  <p class="mute">Верно ${V.ok} из ${total}.</p>
  ${V.wrong.length?`<ul class="list">${V.wrong.map(x=>`<li data-k="${esc(x.k)}"><b>${esc(x.en)}</b><br><span class="mute small">${esc(x.ru)}</span></li>`).join('')}</ul>`:''}
  <div class="row">${passed&&nx?`<button class="btn pri" id="nx">${nx.t==='lesson'?'Следующий урок →':'К марафону →'}</button>`:''}${V.wrong.length?`<button class="btn ${passed?'':'pri'}" id="fix">Повторить ошибки</button>`:''}<button class="btn" id="again">${o.kind==='test'?'Тест снова':'Марафон снова'}</button><button class="btn ghost" id="map">Все уроки</button></div></div></div>`;
  app.querySelectorAll('[data-k]').forEach(l=>l.onclick=()=>sayL(V.wrong.find(x=>x.k===l.dataset.k)));
  $('#home').onclick=o.back;
  const n=$('#nx');if(n)n.onclick=()=>nx.t==='lesson'?go({v:'lstep',id:nx.id,step:lrec(nx.id).step,i:0}):go({v:'marathon',id:nx.id});
  const f=$('#fix');if(f)f.onclick=()=>go({v:'drill',from:o.kind==='test'?'lesson':'ladder',lid:id,title:'Ошибки',q:V.wrong.slice(),n:0,shown:false,res:''});
  $('#again').onclick=()=>go(o.kind==='test'?{v:'lstep',id,step:4,i:0}:{v:'marathon',id});
  $('#map').onclick=()=>go({v:'ladder'});return}
 const x=V.q[V.n],a=V.ans;
 app.innerHTML=`<div class="top"><div class="wrap">${o.head}
 <div class="bar"><i style="width:${V.n/total*100}%"></i></div><p class="small mute">Задание ${V.n+1} из ${total} · без подсказок${o.kind==='marathon'?` · <label style="display:inline"><input type="checkbox" id="tm" ${V.timer?'checked':''}> 10 секунд</label>`:''}</p>
 <div class="card"><div class="cnt">Скажи по-английски</div><div class="ru q">${esc(x.ru)}</div>
 ${o.kind==='marathon'&&V.timer&&!a?'<div class="tbar"><i id="tb"></i></div>':''}
 ${a?`${a.html}<div class="en">${hlL(x.en,x.uses)}</div><div class="row"><button class="btn" id="play">Слушать</button></div>`:`<div class="row">${micBtn('pri')}</div>${typeForm(micOK?'или напиши здесь':'напиши по-английски')}`}
 </div>${a?'<div class="row"><button class="btn pri" id="next">Дальше</button></div>':''}</div></div>`;
 $('#home').onclick=o.back;
 const finish=(alts,typed)=>{if(V.ans)return;clearTimeout(exT);const c=alts?checkL(x,alts,typed):{pass:false,html:'<div class="said"><div class="verdict miss">Время вышло.</div></div>'};
  V.ans={pass:c.pass,html:c.html};const s=st(x.k),b=LS().bank;s.seen=1;
  if(c.pass){V.ok++;s.box=Math.min(5,s.box+1);s.due=day()+IV[s.box];if(b[x.k]!=null){b[x.k]++;if(b[x.k]>=3)delete b[x.k]}}
  else{V.wrong.push(x);s.box=1;s.due=day()+1;b[x.k]=0}
  save();render();sayL(x)};
 if(!a){const mic=$('#mic');if(mic)mic.onclick=()=>listen(mic,al=>finish(al,false));
  $('#f').onsubmit=e=>{e.preventDefault();const v=$('#t').value.trim();if(v)finish([v],true)};
  const tm=$('#tm');if(tm)tm.onchange=e=>{V.timer=S.mtimer=e.target.checked;save();render()};
  if(o.kind==='marathon'&&V.timer){const tb=$('#tb');if(tb)requestAnimationFrame(()=>{tb.style.transition='width 10s linear';tb.style.width='0%'});exT=setTimeout(()=>{if(V.q&&V.q[V.n]===x)finish(null)},10000)}}
 else{$('#play').onclick=()=>sayL(x);$('#next').onclick=()=>{V.n++;V.ans=null;render();scrollTo(0,0)}}
}

/* ---------- views ---------- */
let V={v:'home'};
function go(v){if(play.i>=0)stopPlay();if(rtOn)retellStop();V=v;if(rec){try{rec.abort()}catch(e){}resetMic()}render();scrollTo(0,0)}
function due(){const d=day(),r=[];B.forEach((b,bi)=>b.items.forEach((_,i)=>{const s=S.p[b.id+'-'+i];if(s&&s.seen&&s.due<=d)r.push(it(bi,i))}));
 if(LD)LD.lessons.forEach(L=>lItems(L.id).forEach(x=>{const s=S.p[x.k];if(s&&s.seen&&s.due<=d)r.push(x)}));return r}
function bstats(bi){let seen=0,learned=0;B[bi].items.forEach((_,i)=>{const s=S.p[B[bi].id+'-'+i];if(s&&s.seen)seen++;if(s&&s.box>=3)learned++});return{seen,learned}}

function home(){
 const d=due();
 const card=bi=>{const s=bstats(bi);return`<button class="bl" data-b="${bi}"><span class="n">${bi+1}</span><span class="t"><b>${esc(B[bi].cat)}</b><span class="small mute">Знакомо ${s.seen}/25 · закреплено ${s.learned}</span><span class="bar"><i style="width:${s.learned/25*100}%"></i></span></span></button>`};
 app.innerHTML=`<div class="top"><div class="wrap"><h1>Говори просто.</h1><p>Живые американские фразы и 500 слов. Много повторов. Просто, быстро, понятно.</p>
 ${ladderCard()}
 <div class="today"><div class="cnt">Повтор на сегодня</div><div class="big">${d.length}</div><p class="mute small">${d.length?'Фразы, которые пора вспомнить. Сначала их, потом новое.':'Повторять пока нечего. Начни с блока 1.'}</p>
 <div class="row">${d.length?'<button class="btn pri" id="rev">Повторить</button>':''}<button class="btn" id="simp">Тренажёр «Упрости»</button></div></div></div></div>
 <div class="main"><div class="wrap">
 <h2>Блоки слов</h2><div class="round">Круг 1 · блоки 1–10 · по одному из каждой темы</div>${[...Array(10).keys()].map(card).join('')}
 <div class="round">Круг 2 · блоки 11–20 · те же темы глубже</div>${[...Array(10).keys()].map(i=>card(i+10)).join('')}
 <h2>Пять правил</h2><ol class="rules">
 <li>Одна мысль — одно короткое предложение.</li>
 <li>Кто + что делает + что: <i>I need a ride.</i></li>
 <li>Не переводи русскую фразу. Спроси себя: что я хочу сказать? Скажи только это.</li>
 <li>Не знаешь слово — опиши проще: <i>the thing for paint</i>.</li>
 <li>Ошибки — нормально. Ребёнка понимают и с ошибками.</li></ol>
 <h2>Настройки</h2>
 <label class="chk"><input type="checkbox" id="auto" ${S.auto?'checked':''}> Озвучивать фразу сразу</label>
 <label class="chk">Скорость речи <input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="${S.rate}" style="flex:1"></label>
 <div class="row"><button class="btn" id="bsave">Сохранить прогресс в файл</button><button class="btn" id="bload">Загрузить из файла</button><input type="file" id="bfile" accept=".json,application/json" hidden></div>
 <div class="row"><button class="btn ghost" id="reset">Сбросить прогресс</button></div>
 <p class="small mute" style="margin-top:14px">Повтор: «Трудно» — завтра снова; «Нормально» — через 1, 3, 7, 21, 60 дней; «Легко» — через шаг. Прогресс хранится в этом браузере.${micOK?'':' Голосовая проверка здесь недоступна — открой приложение по своей ссылке в Chrome.'}</p>
 <p class="small" style="margin-top:14px"><a href="privacy.html" style="color:var(--acc);font-weight:800">Политика и отказ от ответственности</a> · приложение предоставляется «как есть».</p>
 </div></div>`;
 app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>go({v:'block',bi:+b.dataset.b}));
 bindLadderCard();$('#bsave').onclick=backupSave;$('#bload').onclick=()=>$('#bfile').click();$('#bfile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(backupLoad)};
 const rv=$('#rev');if(rv)rv.onclick=()=>startPractice('ru',shuffle(d),'Повтор');
 $('#simp').onclick=()=>go({v:'simple',i:0,show:false});
 $('#auto').onchange=e=>{S.auto=e.target.checked;save()};
 $('#rate').oninput=e=>{S.rate=+e.target.value;save()};
 $('#reset').onclick=()=>{const b=$('#reset');if(b.dataset.sure){S.p={};S.L=null;S.rt={};save();render();toast('Прогресс сброшен')}else{b.dataset.sure=1;b.textContent='Точно сбросить? Нажми ещё раз'}};
}
function block(){const bi=V.bi,s=bstats(bi);
 app.innerHTML=`<div class="top"><div class="wrap"><div class="nav"><button class="back" id="home">← Назад</button><button class="back" id="hm">Главная</button></div><h1 style="font-size:clamp(30px,7vw,40px)">${esc(T(bi))}</h1>
 <div class="bar"><i style="width:${s.learned/25*100}%"></i></div><p class="small mute">Знакомо ${s.seen} из 25 · закреплено ${s.learned}</p>
 <div class="today"><p><b>1. Слушай и повторяй</b> — по 5 фраз в день:</p>
 <div class="parts">${[0,1,2,3,4].map(p=>`<button class="btn" data-p="${p}">${p*5+1}–${p*5+5}</button>`).join('')}<button class="btn" data-p="all">Все 25</button></div>
 <p style="margin-top:16px"><b>2. Скажи с русского</b> — фразы, которые ты уже слушал.</p>
 <div class="row"><button class="btn pri" id="ru">Начать</button></div>
 <p style="margin-top:16px"><b>3. Новые ситуации</b> — с Claude, когда блок уже идёт легко.</p>
 <div class="row"><button class="btn" id="cl">Текст для Claude</button><button class="btn ghost" id="wd">Словарь блока</button></div>
 <p style="margin-top:16px"><b>4. Рассказ о себе</b> — «${esc(ST[bi].title)}»: 25 связанных фраз со всеми словами блока. Слушай и перескажи.</p>
 <div class="row"><button class="btn pri" id="sty">Открыть рассказ</button>${S.rt&&S.rt[bi]!=null?`<span class="small mute" style="align-self:center">лучший пересказ: ${S.rt[bi]}/25</span>`:''}</div></div>
 ${bi<19?`<div class="row"><button class="btn ghost" id="nx">Следующий блок →</button></div>`:''}</div></div>`;
 const all=B[bi].items.map((_,i)=>it(bi,i));
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;startPractice('listen',p==='all'?all:all.slice(p*5,p*5+5),T(bi))});
 $('#ru').onclick=()=>{const seen=all.filter(x=>st(x.k).seen);startPractice('ru',shuffle(seen.length?seen:all.slice(0,5)),T(bi))};
 $('#cl').onclick=()=>go({v:'claude',bi});
 $('#wd').onclick=()=>go({v:'words',bi});
 $('#sty').onclick=()=>go({v:'story',bi});
 const nx=$('#nx');if(nx)nx.onclick=()=>go({v:'block',bi:bi+1});
 $('#home').onclick=()=>go({v:'home'});
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startPractice(mode,q,title){const from=V.v==='block'?V.bi:null;V={v:'practice',mode,q,title,from,n:0,total:q.length,good:0,hard:0,shown:false,res:'',hint:false};render();scrollTo(0,0);if(S.auto&&mode==='listen')sayX(q[0])}
const backTo=P=>P.from!=null?{v:'block',bi:P.from}:{v:'home'};

function practice(){
 const P=V;if(P.n>=P.q.length)return done();
 const x=P.q[P.n];const s=st(x.k);
 const head=`<div class="top"><div class="wrap"><div class="nav"><button class="back" id="home">← Назад</button><button class="back" id="hm">Главная</button></div><div class="cnt">${esc(P.title)} · ${P.mode==='listen'?'Слушай и повторяй':'Скажи с русского'} · ${Math.min(P.n+1,P.total)} из ${P.total}</div>`;
 if(P.mode==='listen'){
  app.innerHTML=head+`<div class="card"><span class="word">${esc(x.w)} — ${esc(x.wr)}</span><div class="en">${hl(x.en,x.w)}</div><div class="ru">${esc(x.ru)}</div>
  <div class="row"><button class="btn" id="play">Слушать</button><button class="btn" id="slow">Медленно</button>${micBtn()}</div>
  ${micOK?'':typeForm('напиши фразу по памяти')}
  <div id="res">${P.res}</div></div><p class="small mute" style="margin-top:12px">Послушай → скажи вслух 3 раза → ${micOK?'нажми «Сказать» для проверки':'напиши по памяти для проверки'}.</p>
  <div class="row"><button class="btn pri" id="next">Дальше</button></div></div></div>`;
  $('#next').onclick=()=>{if(!s.seen){s.seen=1;s.box=0;s.due=day()+1;save()}P.n++;P.res='';render();const y=P.q[P.n];if(y&&S.auto)sayX(y)};
  const got=alts=>{const c=check(x.en,alts);P.res=c.html;$('#res').innerHTML=c.html;if(c.sc>=0.9){s.said++;save()}};
  const mic=$('#mic');if(mic)mic.onclick=()=>listen(mic,got);
  const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#t').value.trim();if(v)got([v])};
 }else{
  const shown=P.shown;
  app.innerHTML=head+`<div class="card"><div class="cnt">Скажи по-английски:</div><div class="ru q">${esc(x.ru)}</div>
  ${P.hint&&!shown?`<div class="hint">${esc(hintOf(x.en))}</div>`:''}
  ${shown?`<div class="en">${hl(x.en,x.w)}</div><span class="word">${esc(x.w)} — ${esc(x.wr)}</span>`:''}
  <div class="row">${micBtn('pri')}${shown?'<button class="btn" id="play">Слушать</button><button class="btn" id="slow">Медленно</button>':`<button class="btn" id="hint">Подсказка</button><button class="btn ghost" id="show">Не помню — показать</button>`}</div>
  ${typeForm(micOK?'или напиши здесь':'напиши по-английски')}
  <div id="res">${P.res}</div>
  ${shown?`<p class="small mute" style="margin-top:12px">Как прошло?</p><div class="rate"><button class="btn" data-g="0">Трудно</button><button class="btn" data-g="1">Нормально</button><button class="btn" data-g="2">Легко</button></div>`:''}
  </div></div></div>`;
  const reveal=r=>{P.res=r||'';P.shown=true;render();sayX(x)};
  const h=$('#hint');if(h)h.onclick=()=>{P.hint=true;render()};
  const sh=$('#show');if(sh)sh.onclick=()=>{P.usedShow=true;reveal('')};
  const got=alts=>{const c=check(x.en,alts);if(c.sc>=0.9&&!P.hint&&!P.usedShow&&!P.shown)s.said++;save();if(P.shown){P.res=c.html;$('#res').innerHTML=c.html}else reveal(c.html)};
  $('#f').onsubmit=e=>{e.preventDefault();const v=$('#t').value.trim();if(v)got([v])};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;s.seen=1;
   if(g===0){s.box=1;s.due=day()+1;P.hard++;if(!P.requeued)P.requeued={};if(!P.requeued[x.k]){P.requeued[x.k]=1;P.q.push(x)}}
   else{s.box=Math.min(5,s.box+(g===2?2:1));s.due=day()+IV[s.box];P.good++}
   if(x.lid){const b=LS().bank;if(g===0)b[x.k]=0;else if(b[x.k]!=null){b[x.k]++;if(b[x.k]>=3)delete b[x.k]}}
   save();P.n++;P.shown=false;P.hint=false;P.usedShow=false;P.res='';render()});
  const mic=$('#mic');if(mic)mic.onclick=()=>listen(mic,got);
 }
 $('#home').onclick=()=>go(backTo(P));
 const pl=$('#play');if(pl)pl.onclick=()=>sayX(x);
 const sl=$('#slow');if(sl)sl.onclick=()=>sayX(x,true);
}
function done(){const P=V;
 app.innerHTML=`<div class="top"><div class="wrap"><h1>Круг пройден.</h1><p>${P.mode==='listen'?`Ты проговорил ${P.total} фраз. Теперь попробуй сказать их с русского.`:`Нормально или легко: ${P.good}. Трудных: ${P.hard} — они вернутся завтра.`}</p>
 <div class="row"><button class="btn pri" id="again">Ещё круг</button>${P.mode==='listen'?'<button class="btn" id="toru">Скажи с русского</button>':''}<button class="btn ghost" id="home">Назад</button></div></div></div>`;
 const orig=[...new Map(P.q.map(x=>[x.k,x])).values()];
 const re=(m,q)=>{const f=P.from;startPractice(m,q,P.title);V.from=f};
 $('#again').onclick=()=>re(P.mode,P.mode==='ru'?shuffle(orig):orig);
 const t=$('#toru');if(t)t.onclick=()=>re('ru',shuffle(orig));
 $('#home').onclick=()=>go(backTo(P));
}
function words(){const b=B[V.bi];
 app.innerHTML=`<div class="top"><div class="wrap"><div class="nav"><button class="back" id="home">← Назад</button><button class="back" id="hm">Главная</button></div><h1 style="font-size:32px">${esc(T(V.bi))}</h1><p class="small">Нажми на строку — услышишь фразу.</p></div></div>
 <div class="main"><div class="wrap"><ul class="list">${b.items.map((x,i)=>{const s=S.p[b.id+'-'+i];return`<li data-i="${i}"><b>${esc(x[0])}</b> <span class="mute">— ${esc(x[1])}</span>${s&&s.box>=3?' <span class="ok small">закреплено</span>':''}<br>${hl(x[2],x[0])}<br><span class="mute small">${esc(x[3])}</span></li>`}).join('')}</ul></div></div>`;
 app.querySelectorAll('[data-i]').forEach(l=>l.onclick=()=>speak(b.items[+l.dataset.i][2]));
 $('#home').onclick=()=>go({v:'block',bi:V.bi});
}
function simple(){const i=V.i%SIMPLE.length,x=SIMPLE[i];
 app.innerHTML=`<div class="top"><div class="wrap"><div class="nav"><button class="back" id="home">← Назад</button><button class="back" id="hm">Главная</button></div><div class="cnt">Тренажёр «Упрости» · ${i+1} из ${SIMPLE.length}</div>
 <div class="card"><div class="cnt">Так думаешь по-русски:</div><div class="ru q">${esc(x[0])}</div>
 <p class="small mute">Не переводи. Скажи главное по-английски — 3–6 слов.</p>
 <div class="row">${micBtn('pri')}<button class="btn" id="show">Показать простой вариант</button></div>
 ${typeForm(micOK?'или напиши здесь':'напиши главное по-английски')}
 <div id="res">${V.res||''}</div>
 ${V.show?`<div class="said"><div class="cnt">Простой вариант (твой тоже может быть правильным):</div><div class="en">${esc(x[1])}</div><div class="row"><button class="btn" id="play">Слушать</button></div></div>`:''}
 </div><div class="row"><button class="btn pri" id="next">Дальше</button></div></div></div>`;
 $('#home').onclick=()=>go({v:'home'});
 $('#show').onclick=()=>{V.show=true;render();speak(x[1])};
 const pl=$('#play');if(pl)pl.onclick=()=>speak(x[1]);
 $('#next').onclick=()=>{V.i++;V.show=false;V.res='';render()};
 const got=t=>{const n=norm(t).length;V.res=`<div class="said"><p>Твой вариант: «${esc(t)}»</p><p class="${n<=8?'ok':'miss'}">${n} слов. ${n<=8?'Коротко и понятно — хорошо.':'Длинновато. Попробуй короче.'}</p></div>`;$('#res').innerHTML=V.res};
 const mic=$('#mic');if(mic)mic.onclick=()=>listen(mic,alts=>got(alts[0]));
 $('#f').onsubmit=e=>{e.preventDefault();const v=$('#t').value.trim();if(v)got(v)};
}
function claude(){const b=B[V.bi];
 const txt=`Ты мой учитель английского. Я учу простой разговорный английский. Мои слова: ${b.items.map(x=>x[0]).join(', ')}.\nДай мне по одной короткой бытовой ситуации на русском (магазин, работа маляром, доставка еды, соседи, звонок). Я отвечаю по-английски 1–2 простыми предложениями, используя одно из этих слов. Проверь мой ответ: исправь ошибки коротко, покажи самый простой вариант, потом следующая ситуация. Пиши медленно и просто.`;
 app.innerHTML=`<div class="top"><div class="wrap"><div class="nav"><button class="back" id="home">← Назад</button><button class="back" id="hm">Главная</button></div><h1 style="font-size:32px">Ситуации с Claude</h1><p>Скопируй текст и вставь в чат с Claude — он будет давать новые ситуации со словами блока ${V.bi+1} и проверять тебя.</p>
 <textarea id="ta" readonly>${esc(txt)}</textarea><div class="row"><button class="btn pri" id="cp">Скопировать</button></div></div></div>`;
 $('#home').onclick=()=>go({v:'block',bi:V.bi});
 $('#cp').onclick=()=>{const ta=$('#ta');try{navigator.clipboard.writeText(txt).then(()=>toast('Скопировано'),()=>{ta.select();toast('Выдели и скопируй вручную')})}catch(e){ta.select();toast('Выдели и скопируй вручную')}};
}
function render(){clearTimeout(exT);({home,block,practice,words,simple,claude,story,retell,ladder,lesson,lstep,drill,marathon})[V.v]();const h=$('#hm');if(h){if(V.v==='block'||V.v==='simple'||V.v==='ladder')h.style.display='none';else h.onclick=()=>go({v:'home'})}}
function parentOf(v){switch(v.v){case 'home':return null;case 'block':case 'simple':case 'ladder':return {v:'home'};
 case 'lesson':case 'marathon':return {v:'ladder'};
 case 'lstep':return {v:'lesson',id:v.id};
 case 'drill':return v.from==='lesson'?{v:'lesson',id:v.lid}:{v:'ladder'};
 case 'practice':return v.from!=null?{v:'block',bi:v.from}:{v:'home'};
 case 'story':case 'retell':case 'words':case 'claude':return {v:'block',bi:v.bi};default:return {v:'home'}}}
let exitArmed=0;
window.addEventListener('popstate',()=>{const p=parentOf(V);
 if(p){go(p);try{history.pushState({gp:1},'')}catch(e){}}
 else if(Date.now()-exitArmed>2500){exitArmed=Date.now();toast('Нажми «назад» ещё раз, чтобы выйти');try{history.pushState({gp:1},'')}catch(e){}}
 else{try{history.back()}catch(e){}}});
window.GP={ST,wordHit,toksOf,checkL,get S(){return S},get LD(){return LD}};
try{history.pushState({gp:1},'')}catch(e){}
render();
loadLD().then(j=>{if(j&&V.v==='home')render()});loadLM();
if('serviceWorker' in navigator&&!inFrame&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
